<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web Sedang Diperbarui</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #000000, #0a1a0a, #0d2b0d, #0f3d0f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Grid glow effect */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,255,80,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,80,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Radial green glow center */
    .glow-center {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,80,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(0, 255, 80, 0.35);
      border-radius: 28px;
      padding: 56px 48px;
      max-width: 540px;
      width: 90%;
      text-align: center;
      box-shadow:
        0 0 30px rgba(0,255,80,0.15),
        0 25px 60px rgba(0,0,0,0.8),
        inset 0 0 60px rgba(0,255,80,0.03);
      animation: fadeUp 0.8s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .gear-wrap {
      margin-bottom: 24px;
      position: relative;
      display: inline-block;
    }

    .gear {
      font-size: 72px;
      display: inline-block;
      animation: spin 3s linear infinite;
      filter: drop-shadow(0 0 20px #00ff50);
    }
    .gear.reverse {
      font-size: 44px;
      position: absolute;
      bottom: -4px;
      right: -20px;
      animation: spin 2s linear infinite reverse;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(90deg, #00ff50, #afffca, #00ff50);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 3s linear infinite;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    @keyframes textShimmer {
      0%   { background-position: 0%; }
      100% { background-position: 200%; }
    }

    .subtitle {
      font-size: 1.05rem;
      color: rgba(180, 255, 200, 0.75);
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #003d15, #006622);
      border: 1.5px solid #00ff50;
      border-radius: 50px;
      padding: 10px 28px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 28px;
      color: #00ff50;
      box-shadow: 0 0 20px rgba(0,255,80,0.4), 0 4px 20px rgba(0,0,0,0.5);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0,255,80,0.4); }
      50%       { transform: scale(1.04); box-shadow: 0 0 36px rgba(0,255,80,0.75); }
    }

    .progress-wrap {
      background: rgba(0,255,80,0.1);
      border: 1px solid rgba(0,255,80,0.2);
      border-radius: 50px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-bar {
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, #003d15, #00ff50, #afffca, #00ff50);
      background-size: 300% 100%;
      animation: progressAnim 2.5s ease-in-out infinite alternate, shimmer 2s linear infinite;
      width: 75%;
      box-shadow: 0 0 10px #00ff50;
    }

    @keyframes progressAnim {
      from { width: 50%; }
      to   { width: 88%; }
    }
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .progress-label {
      font-size: 0.78rem;
      color: rgba(0,255,80,0.45);
      margin-bottom: 28px;
    }

    .footer {
      font-size: 0.82rem;
      color: rgba(0,255,80,0.4);
      border-top: 1px solid rgba(0,255,80,0.15);
      padding-top: 18px;
      margin-top: 8px;
    }
    .footer span { color: #00ff50; font-weight: 600; }
  </style>
</head>
<body>

  <div class="glow-center"></div>
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="gear-wrap">
      <span class="gear">⚙️</span>
      <span class="gear reverse">⚙️</span>
    </div>

    <h1>Web Sedang Diperbarui!</h1>
    <p class="subtitle">Kami lagi masak sesuatu yang 🔥 buat kamu.<br>Tunggu sebentar ya~</p>

    <div class="badge">SABAR YA GESSSSSS 😆😆😆😆😆</div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <p class="progress-label">Update progress... hampir selesai nih!</p>

    <div class="footer">
      Dibuat dengan <span>❤️</span> — akan segera kembali!
    </div>
  </div>

  <script>
    const container = document.getElementById('particles');
    const colors = ['#00ff50','#afffca','#00cc40','#66ffaa','#33ff66'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const size = Math.random() * 6 + 2;
      p.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${Math.random() * 100}%;
        bottom: -${size}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        box-shadow: 0 0 ${size * 2}px ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${Math.random() * 10 + 8}s;
        animation-delay: ${Math.random() * 8}s;
      `;
      container.appendChild(p);
    }
  </script>
</body>
</html>
